name: Avant
description: Avant is a Chicago-based financial technology company that provides consumer
  credit products to middle-income U.S. consumers, primarily unsecured personal loans
  of roughly $2,000-$35,000 (9.95%-35.99% APR, 24-60 month terms) for debt consolidation,
  emergencies, home improvement, and other needs, alongside the Avant Credit Card issued
  through WebBank. Founded in 2012 and backed by investors including QED Investors and
  500 Global, Avant operates a mobile-first lending and card-servicing platform with
  a customer help center, personal-finance blog, and SCRA support for military members.
  Avant is a consumer-facing product company and does not publish a public developer
  API or portal; this profile captures its public web, security, and support surfaces.
